services:
  microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-microservice
    environment:
      PORT: 8000 # TODO: change to handle env-defined PORT
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]