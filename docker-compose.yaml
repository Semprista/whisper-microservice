services:
  microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whisper-microservice
    environment:
      PORT: 8000 # TODO: change to handle env-defined PORT
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s